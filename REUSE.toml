# REUSE.toml — nwos-workspace-template (the mould)
#
# Two objects live in this repository (C-005 §2.5):
#   A. The mould itself — Numen Games S.L. scaffolding, licensed MIT.
#   B. The artifact it emits — every file is copied verbatim into a client
#      workspace by GitHub's template-generate API. Ownership of the
#      generated work follows the client; the mould never propagates its
#      own licence to what it generates.
#
# Mould-only artifacts, stripped by nwos-deploy after generation:
#   LICENSE, LICENSES/, REUSE.toml, TRADEMARKS.md, LEGAL_DEBT.md,
#   tests/, .github/
# Renamed by nwos-deploy after generation:
#   LICENSE.client -> LICENSE (placeholders resolved)
#
# This strip list is the contract with nwos-deploy, verified complete
# against the full file inventory on 2026-08-17: every other file in the
# repository is client scaffold and is emitted as-is. Any file added to
# the mould later that is Numen's rather than the client's MUST be added
# to the strip list above in the same commit that adds the file —
# anything absent from this list reaches every generated client
# workspace verbatim.

version = 1

[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Numen Games S.L."
SPDX-License-Identifier = "MIT"

# Engineering Standards is documentation (C-005: docs regime), declared
# by its own inline SPDX comment; "closest" lets the in-file tag govern.
[[annotations]]
path = "ENGINEERING_STANDARDS.md"
precedence = "closest"
SPDX-FileCopyrightText = "2026 Numen Games S.L."
SPDX-License-Identifier = "CC-BY-4.0"

# LICENSE.client is a template artifact, not an active grant in this
# repository: it is the reserved-rights LICENSE that C-005 §2.5 requires
# the mould to emit in the client's name. It reserves rights for a
# placeholder party and licenses nothing here; it takes effect only in a
# generated workspace, once instantiated in the client's name.
[[annotations]]
path = "LICENSE.client"
precedence = "override"
SPDX-FileCopyrightText = "NONE"
SPDX-License-Identifier = "LicenseRef-NWOS-Client-Reserved"
