# Mould CI — mould-only artifact, stripped by nwos-deploy (REUSE.toml).
name: mould-checks
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tests/check-mould.mjs
