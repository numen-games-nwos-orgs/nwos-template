# Mould CI — mould-only artifact, stripped by nwos-deploy (REUSE.toml).
# Actions pinned by commit SHA (SEC-07); tokens read-only (SEC-08).
name: mould-checks
on:
  push:
  pull_request:
permissions: read-all
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: node tests/check-mould.mjs
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install --quiet reuse
      - run: python3 tests/check-reuse.py
