#
# OpenSSF Scorecard (ENGINEERING_STANDARDS §3.1) — weekly + on push to
# main, results published to the repo's security tab. Mould-only
# artifact, stripped by nwos-deploy (REUSE.toml). Pinned per SEC-07.
name: scorecard
on:
  branch_protection_rule:
  schedule:
    - cron: "30 3 * * 1"
  push:
    branches: [main]
permissions: read-all
jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3
        with:
          sarif_file: results.sarif
